name: EscrowX CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Smart Contract CI (Soroban/Cargo)
  # ─────────────────────────────────────────
  smart-contract:
    name: Smart Contract — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow-contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow-contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/escrow-contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cache stellar-cli binary so it doesn't recompile every run (~10-15 min)
      - name: Cache Stellar CLI
        id: cache-stellar-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-v27

      - name: Install system dependencies
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev libhidapi-dev libusb-1.0-0-dev

      - name: Install Stellar CLI
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli

      - name: Build smart contract (WASM)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run contract tests
        run: cargo test

      - name: Verify WASM output
        run: |
          ls -lh target/wasm32-unknown-unknown/release/*.wasm

  # ─────────────────────────────────────────
  # JOB 2: Frontend Build Check
  # ─────────────────────────────────────────
  frontend:
    name: Frontend — Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_API_URL: http://localhost:5000
          VITE_PUBLIC_SOCKET_URL: http://localhost:5000
          VITE_PUBLIC_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          VITE_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          VITE_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
          VITE_PUBLIC_CONTRACT_ID: CBTBAIO245KOQTIWBY57FYEJ7B3LC5ALB344FMW4CQMTWIDPC6GHT225
          VITE_PUBLIC_ESCROWX_CONTRACT_ID: CALCCHS44ZJ6U7CFI2NNRIP6IP63XAMNFTGO4RROBGTBF5L7USASFAL7
          VITE_PUBLIC_XLM_TOKEN_ADDRESS: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          VITE_PUBLIC_NETWORK: TESTNET
          VITE_PUBLIC_STELLAR_EXPERT_BASE_URL: https://stellar.expert/explorer/testnet

  # ─────────────────────────────────────────
  # JOB 3: Deploy Frontend to Vercel
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [smart-contract, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
